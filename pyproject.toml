[project]
name = "bookdrop"
# Written by release-please; see docs/releasing.md.
version = "0.2.0"
description = "A web drop that files purchased ebooks into a Stump library"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
  "uvicorn>=0.32",
]

[project.scripts]
bookdrop = "bookdrop.cli:main"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
