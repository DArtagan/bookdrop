# An example deployment. Set BOOKS_ROOT to the library Stump reads, and
# ADEPT_DIR to the device key adept_activate wrote (see docs/design.md); a
# DRM-free EPUB needs no key.
#
#   BOOKS_ROOT=/srv/books ADEPT_DIR=~/.config/bookdrop/adept docker compose up -d
#
# Confirming a book writes it into BOOKS_ROOT.
services:
  bookdrop:
    image: ghcr.io/dartagan/bookdrop:0.6.1 # x-release-please-version
    restart: unless-stopped
    volumes:
      - ${BOOKS_ROOT:?set BOOKS_ROOT to the books library}:/books
      - ${ADEPT_DIR:-./adept}:/adept:ro
      - data:/data
    ports:
      - "8000:8000"
    healthcheck:
      # The image has no curl or wget.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')
      interval: 30s
      start_period: 10s

volumes:
  data:
